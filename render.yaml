services:
  - type: web
    name: fcas-api
    runtime: node
    plan: free
    buildCommand: |
      npm install --include=dev
      npx prisma generate --schema=server/prisma/schema.prisma
      npx prisma db push --schema=server/prisma/schema.prisma --skip-generate
      mkdir -p server/data
      npx tsx server/prisma/seed.ts
      npm run build:server
    startCommand: node dist/server.mjs
    envVars:
      - key: DATABASE_URL
        value: "file:../data/fcas.db"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        value: "fcas2026"
      - key: PORT
        value: 3001
    healthCheckPath: /api/health
    autoDeploy: true

services:
  - type: web
    name: fcas-api
    runtime: node
    plan: free
    buildCommand: |
      cd server
      npm install
      npx prisma generate
      npx prisma db push --skip-generate
      cd ..
      npm run build:server
    startCommand: node dist/server.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: "file:./data/fcas.db"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        value: "fcas2026"
      - key: PORT
        value: 3001
      - key: CORS_ORIGIN
        sync: false
    healthCheckPath: /api/health
    autoDeploy: true
